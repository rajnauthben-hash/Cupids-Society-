<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F1BBD3">
<meta name="robots" content="noindex,nofollow">
<title>Cupid's Society — Back Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* Same house as the storefront: Cormorant Garamond + Jost, the one pink,
   ink and white. Buttons are ink rather than pink — a control has to be
   readable, and #F1BBD3 can't carry white text. */
:root{
  --bg:#FFFFFF; --paper:#FDFBFC; --fg:#180C14; --pink:#F1BBD3;
  --pink-wash:#FDF4F8; --dim:rgba(24,12,20,.48); --line:rgba(24,12,20,.11);
  --bad:#A3231F; --warn:#8A5100; --good:#1D6B4E;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Jost',system-ui,sans-serif;
  --cw:760px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:var(--sans); font-weight:300; font-size:15px; line-height:1.55;
  background:var(--paper); color:var(--fg);
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
  font-variant-numeric:tabular-nums;
}
h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:.01em;line-height:1.2}
h1{font-size:30px} h2{font-size:22px} h3{font-size:17px}
button,input,select,textarea{font-family:var(--sans);font-size:inherit;color:inherit;font-weight:300}
.hide{display:none!important}
.num{font-weight:500;font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.wrap{max-width:var(--cw);margin:0 auto;padding:0 18px}
header.top{position:sticky;top:0;z-index:20;background:var(--pink);
  padding:calc(14px + env(safe-area-inset-top)) 0 13px}
header.top .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:9px;letter-spacing:.24em;text-transform:uppercase;
  color:rgba(24,12,20,.55);display:block;margin-bottom:3px;font-weight:500}
.linkbtn{background:none;border:0;font-size:12px;letter-spacing:.1em;
  text-transform:uppercase;font-weight:500;padding:6px 0;cursor:pointer;
  border-bottom:1px solid var(--fg)}
main{padding-top:20px}
section.view{animation:rise .22s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- bottom nav ---------- */
/* Scrolls side to side only — touch-action pins it to the horizontal axis so
   it can never drift up or down while you swipe through the tabs. */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);
  border-top:1px solid var(--line);display:flex;
  overflow-x:auto;overflow-y:hidden;touch-action:pan-x;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  padding-bottom:env(safe-area-inset-bottom)}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;min-width:88px;background:none;border:0;
  padding:13px 14px 15px;cursor:pointer;white-space:nowrap;
  color:var(--dim);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  font-weight:500;position:relative}
nav.tabs button[aria-selected="true"]{color:var(--fg)}
nav.tabs button[aria-selected="true"]::before{content:"";position:absolute;top:0;
  left:50%;transform:translateX(-50%);width:34px;height:2px;background:var(--pink)}
.badge{position:absolute;top:7px;right:calc(50% - 30px);background:var(--fg);color:#fff;
  font-size:9px;font-weight:500;min-width:16px;height:16px;border-radius:8px;
  display:grid;place-items:center;padding:0 4px}

/* ---------- pieces ---------- */
.card{background:var(--bg);border:1px solid var(--line);padding:16px;margin-bottom:12px}
.rowbtn{width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);
  padding:12px;margin-bottom:10px;cursor:pointer;display:block}
.rowbtn:active{background:var(--pink-wash)}
.flex{display:flex;gap:12px;align-items:center}
.between{display:flex;gap:12px;align-items:center;justify-content:space-between}
.grow{flex:1;min-width:0}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dim{color:var(--dim)} .small{font-size:13px} .tiny{font-size:11px}

.btn{background:var(--fg);color:#fff;border:0;padding:14px 18px;cursor:pointer;
  width:100%;font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
.btn:active{opacity:.85}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.pink{background:var(--pink);color:var(--fg)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(163,35,31,.25)}
.btn.sm{padding:10px 13px;width:auto;letter-spacing:.12em}
.btn[disabled]{opacity:.4;cursor:default}

label.field{display:block;margin-bottom:14px}
label.field > span{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);margin-bottom:6px;font-weight:500}
input[type=text],input[type=number],input[type=email],input[type=password],
input[type=search],select,textarea{width:100%;background:var(--bg);
  border:1px solid var(--line);padding:12px;outline:none;border-radius:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible
  {outline:2px solid var(--fg);outline-offset:2px}
textarea{min-height:80px;resize:vertical;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.pill{display:inline-block;font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  padding:4px 9px;border:1px solid var(--line);color:var(--dim);font-weight:500}
.pill.on{background:var(--pink);border-color:var(--pink);color:var(--fg)}
.pill.draft{color:var(--warn);border-color:rgba(138,81,0,.3)}

/* ---------- SIGNATURE: the size run ---------- */
/* Reads like the stock sheet she'd otherwise keep on paper. */
.run{display:flex;margin-top:10px;border:1px solid var(--line);background:var(--bg)}
.run .cell{flex:1;min-width:0;text-align:center;padding:6px 2px;border-right:1px solid var(--line)}
.run .cell:last-child{border-right:0}
.run .sz{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);display:block}
.run .qty{font-size:15px;font-weight:400;display:block;font-variant-numeric:tabular-nums}
.run .cell.zero{background:repeating-linear-gradient(135deg,var(--pink-wash) 0 5px,#fff 5px 10px)}
.run .cell.zero .qty{color:rgba(24,12,20,.28);text-decoration:line-through}
.run .cell.low .qty{color:var(--warn)}

/* ---------- SIGNATURE: order tickets ---------- */
.ticket{position:relative;background:var(--bg);border:1px solid var(--line);
  padding:15px 15px 15px 24px;margin-bottom:12px}
.ticket::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;
  background:
    radial-gradient(circle at 0 50%,transparent 0 4px,#fff 4px 4.7px,transparent 4.7px)
    0 0/10px 13px repeat-y, var(--pink);}
.ticket.settled::before{background:var(--line)}
.ticket .ref{font-size:11px;letter-spacing:.12em;color:var(--dim)}
.ticket ul{list-style:none;margin:11px 0}
.ticket li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;
  border-bottom:1px dashed var(--line);font-size:14px}
.ticket li:last-child{border-bottom:0}
.ticket .acts{display:flex;gap:8px;margin-top:11px}
.ticket .acts .btn{flex:1}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--bg);border:1px solid var(--line);padding:14px}
.stat .k{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);font-weight:500}
.stat .v{font-family:var(--serif);font-size:28px;font-weight:500;margin-top:2px;line-height:1.1}
.stat .v small{font-size:12px;font-family:var(--sans);color:var(--dim)}

.chart{display:flex;align-items:flex-end;gap:3px;height:70px;margin:14px 0 6px}
.chart .bar{flex:1;background:var(--pink);min-height:2px}
.chart .bar.top{background:var(--fg)}
.axis{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);
  letter-spacing:.06em}

.rank{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank .n{font-size:11px;color:var(--dim);width:14px}
.rank .bar2{height:4px;background:var(--pink);margin-top:6px}

/* ---------- photos ---------- */
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.imgs .thumb{position:relative;aspect-ratio:3/4;overflow:hidden;border:1px solid var(--line);
  background:var(--pink-wash)}
.imgs .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.imgs .thumb .x{position:absolute;top:5px;right:5px;background:rgba(24,12,20,.75);color:#fff;
  border:0;width:22px;height:22px;border-radius:50%;font-size:13px;cursor:pointer;
  display:grid;place-items:center;line-height:1}
.imgs .thumb .star{position:absolute;bottom:5px;left:5px;background:rgba(255,255,255,.94);
  border:0;font-size:8px;font-weight:500;padding:4px 6px;cursor:pointer;
  letter-spacing:.1em;text-transform:uppercase}
.imgs .thumb.primary{outline:2px solid var(--fg);outline-offset:-2px}
/* ---------- lookbook ---------- */
.lb-row{display:flex;gap:12px;align-items:flex-start;background:var(--bg);
  border:1px solid var(--line);padding:12px;margin-bottom:10px}
.lb-row.off{background:var(--paper)}
.lb-row.off .lb-shot{opacity:.35}
.lb-shot{width:62px;aspect-ratio:3/4;object-fit:cover;display:block;flex-shrink:0;
  border:1px solid var(--line);background:var(--pink-wash)}
.lb-meta{flex:1;min-width:0}
.lb-meta input[type=text]{margin-bottom:8px}
.lb-ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lb-ctl .ord{width:56px;text-align:center;font-variant-numeric:tabular-nums;padding:9px 4px}
.lb-ctl .btn.sm{flex-shrink:0}

.imgs .add{aspect-ratio:3/4;border:1px dashed var(--line);background:none;cursor:pointer;
  color:var(--dim);font-size:11px;display:grid;place-items:center;text-align:center;padding:8px;
  letter-spacing:.06em}

/* ---------- size rows ---------- */
.vrow{display:grid;grid-template-columns:1fr 108px 32px;gap:8px;align-items:center;margin-bottom:8px}
.vrow input[type=text]{padding:10px 11px}
.stepper{display:flex;border:1px solid var(--line);background:var(--bg)}
.stepper button{width:32px;border:0;background:none;font-size:16px;cursor:pointer;color:var(--dim)}
.stepper input{border:0;text-align:center;padding:10px 0;font-weight:400;min-width:0}
.vrow .del{background:none;border:0;color:var(--dim);font-size:17px;cursor:pointer;padding:4px}
.sizeadd{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sizeadd button{border:1px solid var(--line);background:none;padding:7px 12px;font-size:11px;
  letter-spacing:.1em;cursor:pointer}
.sizeadd button:active{background:var(--pink)}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(24,12,20,.45);z-index:40;animation:fade .18s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{position:fixed;inset:0;z-index:41;background:var(--paper);display:flex;
  flex-direction:column;animation:up .24s cubic-bezier(.2,.8,.3,1) both}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.sheet .shead{background:var(--pink);
  padding:calc(14px + env(safe-area-inset-top)) 18px 13px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet .sbody{flex:1;overflow-y:auto;padding:18px 18px 34px;-webkit-overflow-scrolling:touch}
.sheet .sfoot{border-top:1px solid var(--line);background:var(--bg);
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));display:flex;gap:9px}
.sheet .sfoot .btn{flex:1}
@media(min-width:780px){
  .sheet{top:4vh;bottom:4vh;left:50%;transform:translateX(-50%);width:660px;
    border:1px solid var(--line)}
  @keyframes up{from{transform:translateX(-50%) translateY(16px);opacity:0}
                to{transform:translateX(-50%);opacity:1}}
}

/* ---------- login ---------- */
#gate{min-height:100dvh;display:grid;place-items:center;padding:26px}
#gate .box{width:100%;max-width:330px;text-align:center}
#gate .heart{font-size:26px;color:var(--pink);margin-bottom:10px}
#gate .box .btn,#gate .box label{text-align:left}

/* ---------- misc ---------- */
.empty{text-align:center;padding:46px 20px;color:var(--dim)}
.empty .big{font-family:var(--serif);font-size:20px;color:var(--fg);margin-bottom:6px}
.err{background:var(--pink-wash);border:1px solid rgba(163,35,31,.22);color:var(--bad);
  padding:11px 13px;font-size:13px;margin-bottom:14px;text-align:left}
.seg{display:flex;border:1px solid var(--line);margin-bottom:16px;background:var(--bg)}
.seg button{flex:1;border:0;background:none;padding:10px 4px;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim);cursor:pointer;font-weight:500;
  border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-selected="true"]{background:var(--pink);color:var(--fg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;z-index:60;
  background:var(--fg);color:#fff;padding:12px 18px;font-size:12px;letter-spacing:.06em;
  animation:rise .2s ease both;max-width:88vw;text-align:center}
.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;
  border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:-2px}
.ghost .spin,.sfoot .ghost .spin{border-color:var(--line);border-top-color:var(--fg)}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ============ SIGN IN ============ -->
<div id="gate">
  <div class="box">
    <div class="heart">&#x2661;</div>
    <h1>Cupid's Society</h1>
    <p class="dim small" style="margin:4px 0 24px;letter-spacing:.14em;
      text-transform:uppercase;font-size:10px">Back Office</p>
    <div id="gateErr" class="err hide"></div>
    <label class="field"><span>Email</span>
      <input type="email" id="email" autocomplete="username" inputmode="email"></label>
    <label class="field"><span>Password</span>
      <input type="password" id="password" autocomplete="current-password"></label>
    <button class="btn" id="signIn">Sign in</button>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hide">
  <header class="top">
    <div class="wrap">
      <div>
        <span class="eyebrow" id="todayLabel">—</span>
        <h1 id="viewTitle">Today</h1>
      </div>
      <button class="linkbtn" id="signOut">Sign out</button>
    </div>
  </header>

  <main class="wrap">
    <section class="view" id="v-today"></section>
    <section class="view hide" id="v-clothing"></section>
    <section class="view hide" id="v-thrift"></section>
    <section class="view hide" id="v-orders"></section>
    <section class="view hide" id="v-lookbook"></section>
  </main>

  <nav class="tabs">
    <button data-tab="today"    aria-selected="true">Today</button>
    <button data-tab="clothing" aria-selected="false">Clothing</button>
    <button data-tab="thrift"   aria-selected="false">Thrift</button>
    <button data-tab="orders"   aria-selected="false">Orders
      <span class="badge hide" id="pendBadge">0</span></button>
    <button data-tab="lookbook" aria-selected="false">Lookbook</button>
  </nav>
</div>

<div id="sheetHost"></div>
<div id="toastHost"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* =====================================================================
   CONFIG — Supabase → Project Settings → API
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL      : 'https://adsflnylewjhdmpzzghs.supabase.co',
  SUPABASE_ANON_KEY : 'sb_publishable_99im139cBdu32Kh3pttLnA_KhWx87B7',
  LOW_STOCK_AT      : 2,
  SIZES             : ['XS','S','M','L','XL','XXL','One size'],
  TAGS              : ['New In','Bestseller','Resort Wear','One of One','Back in Stock','Out of Stock'],
  SUBS : { clothing:['all','dresses','jumpsuits','two-piece'],
           swimwear:['all','bikini','monokini','cover-ups'] },
  SUBLABEL : { all:'All', dresses:'Dresses', jumpsuits:'Jumpsuits',
               'two-piece':'Two-piece', bikini:'Bikini', monokini:'Monokini',
               'cover-ups':'Cover-ups' }
};

const sb = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
const $  = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (n, cur='TTD') =>
  cur + ' $' + Number(n||0).toLocaleString('en-TT',
    {minimumFractionDigits:0, maximumFractionDigits:2});
const slugify = s => s.toLowerCase().trim()
  .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60);

let DB = { products:[], orders:[], lookbook:[], collections:[], lookbookReady:true };
let TAB = 'today';

function toast(msg){
  $('#toastHost').innerHTML = `<div class="toast">${esc(msg)}</div>`;
  setTimeout(()=>{ $('#toastHost').innerHTML=''; }, 2800);
}

/* ---------------- auth ---------------- */
$('#signIn').onclick = async () => {
  const b = $('#signIn'); b.disabled = true; b.innerHTML = '<span class="spin"></span>';
  const { error } = await sb.auth.signInWithPassword({
    email: $('#email').value.trim(), password: $('#password').value });
  b.disabled = false; b.textContent = 'Sign in';
  if (error){
    const e = $('#gateErr');
    e.textContent = 'That email and password don\u2019t match an account.';
    e.classList.remove('hide'); return;
  }
  boot();
};
$('#signOut').onclick = async () => { await sb.auth.signOut(); location.reload(); };

/* ---------------- boot ---------------- */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session){ $('#gate').classList.remove('hide'); $('#app').classList.add('hide'); return; }
  $('#gate').classList.add('hide'); $('#app').classList.remove('hide');
  $('#todayLabel').textContent = new Date().toLocaleDateString('en-GB',
    { weekday:'long', day:'numeric', month:'long' });
  await load(); render();
}

async function load(){
  const [p, o, lb, lc] = await Promise.all([
    sb.from('products').select('*, variants(*), product_images(*)')
      .neq('status','archived').order('sort_order'),
    sb.from('orders').select('*, order_items(*)')
      .order('created_at',{ascending:false}).limit(300),
    sb.from('lookbook_images').select('*').order('display_order'),
    sb.from('lookbook_collections').select('*').order('display_order')
  ]);
  if (p.error || o.error) toast('Couldn\u2019t reach the database. Check your connection.');
  // The lookbook table may not exist yet on an un-migrated project; that is not
  // a connection problem, so it gets its own quiet fallback.
  if (lb.error) console.warn('lookbook_images unavailable:', lb.error.message);
  if (lc.error) console.warn('lookbook_collections unavailable:', lc.error.message);
  // Only a genuinely missing table counts as "not set up". Postgres 42P01 is
  // "undefined table"; PGRST205 is the table existing but not yet in
  // PostgREST's schema cache. Anything else (network, auth) is a real error
  // and must not be reported as a missing migration.
  DB.lookbookReady = !lc.error
    || !['42P01','PGRST205','PGRST106'].includes(lc.error.code || '');
  DB.lookbookError = lc.error || null;
  DB.products = p.data || [];
  DB.orders   = o.data || [];
  DB.lookbook = lb.data || [];
  DB.collections = lc.data || [];
  const n = DB.orders.filter(x=>x.status==='pending').length;
  const b = $('#pendBadge'); b.textContent = n; b.classList.toggle('hide', n===0);
}

document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => {
  TAB = b.dataset.tab;
  document.querySelectorAll('nav.tabs button')
    .forEach(x => x.setAttribute('aria-selected', String(x.dataset.tab===TAB)));
  $('#viewTitle').textContent =
    {today:'Today',clothing:'Clothing',thrift:'Thrift',orders:'Orders',lookbook:'Lookbook'}[TAB];
  ['today','clothing','thrift','orders','lookbook']
    .forEach(t => $('#v-'+t).classList.toggle('hide', t!==TAB));
  render(); window.scrollTo(0,0);
  // keep the active tab in view now that the bar scrolls
  b.scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
});
function render(){
  if (TAB==='today')    renderToday();
  if (TAB==='clothing') renderStock('clothing');
  if (TAB==='thrift')   renderStock('thrift');
  if (TAB==='orders')   renderOrders();
  if (TAB==='lookbook') renderLookbook();
}

const sortSizes = (a,b) => {
  const i = s => { const k = CONFIG.SIZES.indexOf(s); return k<0 ? 99 : k; };
  return i(a.size) - i(b.size);
};
const primaryImg = p => (p.product_images||[]).slice()
  .sort((a,b)=>(b.is_primary-a.is_primary)||a.sort_order-b.sort_order)[0];
const totalStock = p => (p.variants||[]).reduce((s,v)=>s+v.stock,0);

/* =====================================================================
   TODAY
   ===================================================================== */
function renderToday(){
  const conf = DB.orders.filter(o=>o.status==='confirmed');
  const now = new Date();
  const inMonth = o => {
    const d = new Date(o.confirmed_at||o.created_at);
    return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
  };
  const ttd = conf.filter(o=>inMonth(o)&&o.currency==='TTD')
    .reduce((s,o)=>s+Number(o.subtotal),0);
  const usd = conf.filter(o=>inMonth(o)&&o.currency==='USD')
    .reduce((s,o)=>s+Number(o.subtotal),0);
  const pend = DB.orders.filter(o=>o.status==='pending');

  const units = {};
  conf.forEach(o => (o.order_items||[]).forEach(i =>
    units[i.product_name] = (units[i.product_name]||0) + i.qty));
  const best = Object.entries(units).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxU = best[0]?.[1] || 1;

  const days = [...Array(14)].map((_,k)=>{
    const d = new Date(); d.setDate(d.getDate()-(13-k));
    return { d, total: conf.filter(o=>o.currency==='TTD' &&
      new Date(o.confirmed_at||o.created_at).toDateString()===d.toDateString())
      .reduce((s,o)=>s+Number(o.subtotal),0) };
  });
  const peak = Math.max(...days.map(x=>x.total), 1);

  const low = [];
  DB.products.filter(p=>p.status==='active').forEach(p =>
    (p.variants||[]).forEach(v => { if (v.stock<=CONFIG.LOW_STOCK_AT) low.push({p,v}); }));
  low.sort((a,b)=>a.v.stock-b.v.stock);

  const web  = DB.orders.filter(o=>o.source==='cart_checkout'||o.source==='product_page');
  const won  = web.filter(o=>o.status==='confirmed').length;
  const rate = web.length ? Math.round(won/web.length*100) : 0;

  $('#v-today').innerHTML = `
    <div class="stats">
      <div class="stat"><div class="k">This month</div>
        <div class="v">$${ttd.toLocaleString()} <small>TTD</small></div></div>
      <div class="stat"><div class="k">Waiting on you</div>
        <div class="v">${pend.length} <small>order${pend.length===1?'':'s'}</small></div></div>
    </div>
    ${usd ? `<div class="card" style="padding:12px 16px"><div class="between">
        <span class="k tiny dim" style="letter-spacing:.18em;text-transform:uppercase">
          Also this month</span>
        <span class="num">$${usd.toLocaleString()} USD</span></div></div>` : ''}

    ${pend.length ? `<button class="btn pink" id="goPending" style="margin-bottom:16px">
      Review ${pend.length} pending order${pend.length===1?'':'s'}</button>` : ''}

    <div class="card">
      <h2>Best sellers</h2>
      <p class="dim tiny" style="margin:2px 0 10px;letter-spacing:.1em;
        text-transform:uppercase">Units sold, all time</p>
      ${best.length ? best.map(([n,q],k)=>`
        <div class="rank"><span class="n">${k+1}</span>
          <div class="grow">
            <div class="small truncate">${esc(n)}</div>
            <div class="bar2" style="width:${Math.round(q/maxU*100)}%"></div>
          </div><span class="num">${q}</span></div>`).join('')
        : `<p class="dim small">Nothing sold yet. Confirmed orders appear here.</p>`}
    </div>

    <div class="card">
      <h2>Revenue</h2>
      <p class="dim tiny" style="margin:2px 0 0;letter-spacing:.1em;
        text-transform:uppercase">Last 14 days, TTD</p>
      <div class="chart">${days.map(x=>`<div class="bar ${x.total===peak&&peak>0?'top':''}"
        style="height:${Math.max(2, x.total/peak*100)}%"
        title="${x.d.toLocaleDateString()} — $${x.total}"></div>`).join('')}</div>
      <div class="axis">
        <span>${days[0].d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</span>
        <span class="num">$${days.reduce((s,x)=>s+x.total,0).toLocaleString()} total</span>
        <span>Today</span></div>
    </div>

    <div class="card">
      <h2>Running low</h2>
      <p class="dim tiny" style="margin:2px 0 10px;letter-spacing:.1em;
        text-transform:uppercase">${CONFIG.LOW_STOCK_AT} or fewer left</p>
      ${low.length ? low.slice(0,8).map(({p,v})=>`
        <div class="rank"><div class="grow">
          <div class="small truncate">${esc(p.name)}</div>
          <div class="tiny dim">${esc(v.size)}</div></div>
          <span class="num" style="color:${v.stock===0?'var(--bad)':'var(--warn)'}">
            ${v.stock}</span></div>`).join('')
        : DB.products.length
          ? `<p class="dim small">Every size is stocked.</p>`
          : `<p class="dim small">No pieces added yet.</p>`}
    </div>

    <div class="card">
      <h2>Interest vs sales</h2>
      <p class="dim tiny" style="margin:2px 0 12px;letter-spacing:.1em;
        text-transform:uppercase">Checkouts started on the site</p>
      <div class="between">
        <div><div class="k tiny dim">STARTED</div><div class="v num"
          style="font-family:var(--serif);font-size:26px">${web.length}</div></div>
        <div><div class="k tiny dim">BOUGHT</div><div class="v num"
          style="font-family:var(--serif);font-size:26px">${won}</div></div>
        <div><div class="k tiny dim">RATE</div><div class="v num"
          style="font-family:var(--serif);font-size:26px">${rate}%</div></div>
      </div>
    </div>`;

  const g = $('#goPending');
  if (g) g.onclick = () => document.querySelector('[data-tab="orders"]').click();
}

let q = '', filterCat = '';
// shelf is 'clothing' (everything that is not thrift) or 'thrift'.
function renderStock(shelf){
  const onShelf = p => shelf === 'thrift' ? !!p.is_thrift : !p.is_thrift;
  const list = DB.products.filter(p =>
    onShelf(p) &&
    (!q || p.name.toLowerCase().includes(q.toLowerCase())) &&
    (!filterCat || p.cat === filterCat));

  $('#v-' + shelf).innerHTML = `
    <button class="btn" id="newProduct" style="margin-bottom:6px">${
      shelf === 'thrift' ? 'Add a thrifted piece' : 'Add a piece'}</button>
    <p class="dim tiny" style="margin-bottom:14px;text-align:center;letter-spacing:.06em">
      Tap any piece below to edit it</p>
    <input type="search" id="sq" placeholder="Search pieces" value="${esc(q)}"
      style="margin-bottom:10px">
    <div class="seg">
      ${[['','All'],['clothing','Clothing'],['swimwear','Swimwear']]
        .map(([v,l])=>`<button data-cat="${v}" aria-selected="${filterCat===v}">${l}</button>`).join('')}
    </div>

    ${list.length ? list.map(p=>{
      const vs = (p.variants||[]).slice().sort(sortSizes);
      const img = primaryImg(p);
      const out = totalStock(p) === 0;
      return `<button class="rowbtn" data-product="${p.id}">
        <div class="flex">
          <div style="width:58px;height:76px;overflow:hidden;background:var(--pink-wash);flex:none;display:grid;place-items:center">
            ${img
              ? `<img src="${esc(img.url)}" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover">`
              : `<span style="font-size:9px;color:var(--dim);text-align:center;letter-spacing:.06em;line-height:1.4;padding:4px">No<br>photo</span>`}
          </div>
          <div class="grow">
            <div class="between" style="gap:8px">
              <h3 class="truncate">${esc(p.name)}</h3>
              ${p.status==='draft' ? `<span class="pill draft">Hidden</span>`
                : out ? `<span class="pill">Sold out</span>`
                : p.featured ? `<span class="pill on">Home</span>` : ''}
            </div>
            <div class="small dim">${money(p.price_ttd)}
              · ${esc(p.color||'—')}
              · <span class="num">${totalStock(p)}</span> in stock</div>
            ${vs.length ? `<div class="run">${vs.map(v=>`
              <div class="cell ${v.stock===0?'zero':(v.stock<=CONFIG.LOW_STOCK_AT?'low':'')}">
                <span class="sz">${esc(v.size)}</span>
                <span class="qty">${v.stock}</span></div>`).join('')}</div>`
              : `<div class="tiny dim" style="margin-top:6px">No sizes yet</div>`}
          </div>
          <div style="color:var(--dim);font-size:20px;flex:none;padding-left:10px;align-self:center">›</div>
        </div></button>`;
    }).join('') : `<div class="empty"><div class="big">Nothing here</div>
      <p class="small">Add a piece to start tracking it.</p></div>`}`;

  const view = $('#v-' + shelf);
  view.querySelector('#newProduct').onclick = () => openProduct(null, shelf === 'thrift');
  view.querySelector('#sq').oninput = e => {
    q = e.target.value; const pos = e.target.selectionStart; renderStock(shelf);
    const el = view.querySelector('#sq'); el.focus(); el.setSelectionRange(pos,pos);
  };
  view.querySelectorAll('[data-cat]').forEach(b =>
    b.onclick = () => { filterCat = b.dataset.cat; renderStock(shelf); });
  view.querySelectorAll('[data-product]').forEach(b =>
    b.onclick = () => openProduct(b.dataset.product));
}

let draft = null, slugTouched = false;

function openProduct(id, isThrift){
  const p = id ? DB.products.find(x=>x.id===id) : null;
  draft = p ? JSON.parse(JSON.stringify(p)) : {
    id:null, slug:'', name:'', tag:'', cat:'clothing', sub:'all', color:'',
    price_ttd:0, price_usd:0, description:'', details:'', care:'',
    featured:false, status:'active', sort_order:99,
    is_thrift:!!isThrift, variants:[], product_images:[]
  };
  draft.variants = (draft.variants||[]).sort(sortSizes);
  slugTouched = !!p;
  drawSheet();
}

      <div class="two">

        <label class="field"><span>Badge</span>

function vRow(v,i){
  return `<div class="vrow" data-vi="${i}">
    <input type="text" class="vSize" value="${esc(v.size)}" placeholder="Size">
    <div class="stepper">
      <button type="button" data-step="-1">−</button>
      <input type="number" class="vStock" value="${v.stock}" min="0" inputmode="numeric">
      <button type="button" data-step="1">+</button>
    </div>
    <button class="del" data-delvar="${i}" aria-label="Remove size">×</button>
  </div>`;
}

function readSheet(){
  const d = draft;
  d.name        = $('#fName').value.trim();
  d.price_ttd   = Number($('#fTtd').value)||0;
  d.price_usd   = Number($('#fUsd').value)||0;
  d.cat         = $('#fCat').value;
  d.sub         = $('#fSub').value;
  d.is_thrift   = $('#fThrift').value === '1';
  d.color       = $('#fColor').value.trim();
  d.tag         = $('#fTag').value || null;
  d.status      = $('#fStatus').value;
  d.featured    = $('#fFeat').checked;
  d.description = $('#fDesc').value.trim();
  d.details     = $('#fDet').value.trim();
  d.care        = $('#fCare').value.trim();
  d.slug        = slugify($('#fSlug').value) || slugify(d.name);
  d.variants = [...document.querySelectorAll('.vrow')].map((r,i)=>({
    ...(d.variants[i]||{}),
    size:  r.querySelector('.vSize').value.trim() || 'One size',
    stock: Math.max(0, parseInt(r.querySelector('.vStock').value)||0)
  }));
}

function wireSheet(){
  const close = () => { $('#sheetHost').innerHTML=''; draft=null; };
  $('#scrim').onclick = close; $('#closeSheet').onclick = close; $('#cancelSheet').onclick = close;

  $('#fName').oninput = () => {
    if (!slugTouched) $('#fSlug').value = slugify($('#fName').value);
  };
  $('#fSlug').oninput = () => { slugTouched = true; };
  $('#fCat').onchange    = () => { readSheet(); drawSheet(); };
  $('#fThrift').onchange = () => { readSheet(); drawSheet(); };

  document.querySelectorAll('[data-addsize]').forEach(b => b.onclick = () => {
    readSheet();
    const s = b.dataset.addsize;
    if (draft.variants.some(v=>v.size===s)){ toast(s + ' is already listed.'); return; }
    draft.variants.push({ size:s, stock:0 });
    draft.variants.sort(sortSizes);
    $('#vList').innerHTML = draft.variants.map(vRow).join('');
    wireVars();
  });
  wireVars();

  document.querySelectorAll('[data-delimg]').forEach(b =>
    b.onclick = () => deleteImage(b.dataset.delimg));
  document.querySelectorAll('[data-primary]').forEach(b =>
    b.onclick = () => setPrimary(b.dataset.primary));
  $('#addImg').onclick = () => {
    if (!draft.id){ toast('Save the piece first, then add photos.'); return; }
    $('#fileIn').click();
  };
  $('#fileIn').onchange = e => uploadImages([...e.target.files]);

  $('#saveProduct').onclick = saveProduct;
  const del = $('#delProduct'); if (del) del.onclick = archiveProduct;
  const hardDel = $('#hardDeleteProduct'); if (hardDel) hardDel.onclick = hardDeleteProduct;
}

function wireVars(){
  document.querySelectorAll('.vrow [data-step]').forEach(b => b.onclick = () => {
    const inp = b.parentElement.querySelector('.vStock');
    inp.value = Math.max(0, (parseInt(inp.value)||0) + Number(b.dataset.step));
  });
  document.querySelectorAll('[data-delvar]').forEach(b => b.onclick = () => {
    readSheet();
    draft.variants.splice(Number(b.dataset.delvar),1);
    $('#vList').innerHTML = draft.variants.map(vRow).join('');
    wireVars();
  });
}

async function saveProduct(){
  readSheet();
  if (!draft.name){ toast('Give the piece a name first.'); return; }
  if (!draft.slug){ toast('The web address can\u2019t be empty.'); return; }

  const btn = $('#saveProduct');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';

  const row = {
    slug:draft.slug, name:draft.name, tag:draft.tag, cat:draft.cat, sub:draft.sub,
    is_thrift:!!draft.is_thrift,
    color:draft.color, price_ttd:draft.price_ttd, price_usd:draft.price_usd,
    description:draft.description, details:draft.details, care:draft.care,
    featured:draft.featured, status:draft.status
  };

  let pid = draft.id;
  if (pid){
    const { error } = await sb.from('products').update(row).eq('id', pid);
    if (error) return failSave(btn, error);
  } else {
    const { data, error } = await sb.from('products').insert(row).select().single();
    if (error) return failSave(btn, error);
    pid = data.id;
  }

  const keep = [];
  for (const v of draft.variants){
    const payload = { product_id:pid, size:v.size, stock:v.stock };
    const { data, error } = await sb.from('variants')
      .upsert(payload, { onConflict:'product_id,size' }).select().single();
    if (error) return failSave(btn, error);
    keep.push(data.id);
  }
  const had = (DB.products.find(p=>p.id===pid)?.variants||[]).map(v=>v.id);
  const gone = had.filter(id => !keep.includes(id));
  if (gone.length) await sb.from('variants').delete().in('id', gone);

  await load(); $('#sheetHost').innerHTML=''; draft=null; render();
  toast('Saved');
}
function failSave(btn, error){
  btn.disabled = false; btn.textContent = 'Save';
  toast(error.message?.includes('duplicate') && error.message.includes('slug')
    ? 'Another piece already uses that web address.'
    : (error.message || 'Couldn\u2019t save. Try again.'));
}

async function archiveProduct(){
  if (!confirm('Hide "' + draft.name + '" from the site?')) return;
  await sb.from('products').update({ status:'archived' }).eq('id', draft.id);
  await load(); $('#sheetHost').innerHTML=''; draft=null; render();
  toast('Hidden from the site');
}

async function hardDeleteProduct(){
  if (!confirm('Permanently delete "' + draft.name + '"? This cannot be undone.')) return;
  for (const im of (draft.product_images||[])){
    if (im.storage_path) await sb.storage.from('product-images').remove([im.storage_path]);
  }
  const { error } = await sb.from('products').delete().eq('id', draft.id);
  if (error){ toast(error.message||'Delete failed'); return; }
  await load(); $('#sheetHost').innerHTML=''; draft=null; render();
  toast('Deleted permanently');
}

/* ---------------- photos ---------------- */
async function uploadImages(files){
  if (!files.length) return;
  $('#imgGrid').insertAdjacentHTML('beforeend',
    `<div class="add"><span class="spin" style="border-color:var(--line);
      border-top-color:var(--fg)"></span></div>`);
  const n = (draft.product_images||[]).length;

  for (const [k,file] of files.entries()){
    const ext  = (file.name.split('.').pop()||'jpg').toLowerCase();
    const path = `${draft.id}/${crypto.randomUUID()}.${ext}`;
    const { error:upErr } = await sb.storage.from('product-images')
      .upload(path, file, { cacheControl:'3600', upsert:false });
    if (upErr){ toast('Photo upload failed: ' + upErr.message); break; }

    const { data:{ publicUrl } } = sb.storage.from('product-images').getPublicUrl(path);
    const { data, error } = await sb.from('product_images').insert({
      product_id:draft.id, url:publicUrl, storage_path:path,
      sort_order:n+k, is_primary: n===0 && k===0
    }).select().single();
    if (error){ toast(error.message); break; }
    draft.product_images.push(data);
  }
  drawSheet();
}

async function deleteImage(id){
  const im = draft.product_images.find(x=>x.id===id);
  if (im?.storage_path) await sb.storage.from('product-images').remove([im.storage_path]);
  await sb.from('product_images').delete().eq('id', id);
  draft.product_images = draft.product_images.filter(x=>x.id!==id);
  if (im?.is_primary && draft.product_images[0]) await setPrimary(draft.product_images[0].id, true);
  else drawSheet();
}

async function setPrimary(id, quiet){
  await sb.from('product_images').update({is_primary:false}).eq('product_id', draft.id);
  await sb.from('product_images').update({is_primary:true}).eq('id', id);
  draft.product_images.forEach(x => x.is_primary = (x.id===id));
  drawSheet();
  if (!quiet) toast('That photo shows first now');
}

/* =====================================================================
   LOOKBOOK
   Photos live inside named collections. The Lookbook tab lists the
   collections; opening one shows its photos. Order is a plain 1..n list
   in both places — the number is the position, and saving one renumbers
   the rest so there are never gaps or ties.
   ===================================================================== */
let openColl = null;   // id of the collection being viewed, null = list

const collSorted = () => DB.collections.slice()
  .sort((a,b) => a.display_order - b.display_order || a.created_at.localeCompare(b.created_at));
const shotsIn = cid => DB.lookbook.filter(r => r.collection_id === cid)
  .sort((a,b) => a.display_order - b.display_order || a.created_at.localeCompare(b.created_at));

function renderLookbook(){
  if (openColl && !DB.collections.some(c => c.id === openColl)) openColl = null;
  return openColl ? renderCollection() : renderCollectionList();
}

/* ---------------- the list of collections ---------------- */
function renderCollectionList(){
  const rows = collSorted();
  const live = rows.filter(c => c.is_active).length;

  // Without the table there is nothing to add to — say so rather than
  // showing an empty panel that looks broken.
  if (!DB.lookbookReady){
    const e = DB.lookbookError || {};
    // PGRST205 means the table is there but the API hasn't noticed it yet.
    const cached = (e.code === 'PGRST205') || /schema cache/i.test(e.message || '');
    $('#v-lookbook').innerHTML = `
      <div class="card">
        <h3 style="margin-bottom:8px">${cached ? 'Almost there' : 'One setup step left'}</h3>
        <p class="small dim" style="line-height:1.6">${cached
          ? `The table exists but the API hasn’t picked it up yet. In the Supabase
             SQL Editor run <strong>notify pgrst, 'reload schema';</strong> then
             pull down to reload this page.`
          : `The lookbook tables haven’t been created in Supabase yet, so collections
             can’t be saved. Run <strong>thrift-and-collections-migration.sql</strong>
             in the Supabase SQL Editor, then reload this page.`}</p>
        <button class="btn ghost sm" id="lbRetry" style="margin-top:12px">Check again</button>
        <p class="tiny dim" style="margin-top:10px;word-break:break-word">
          ${esc(e.code ? e.code + ' — ' : '')}${esc(e.message || '')}</p>
      </div>`;
    $('#lbRetry').onclick = async () => { await load(); render(); };
    return;
  }

  $('#v-lookbook').innerHTML = `
    <div class="card">
      <div class="small dim" style="margin-bottom:12px">${
        rows.length
          ? `${rows.length} collection${rows.length===1?'':'s'} · ${live} showing on the site`
          : 'Group your lookbook photos into named collections.'}</div>
      <label class="field" style="margin-bottom:10px">
        <span>New collection</span>
        <input type="text" id="collNew" placeholder="Name it — e.g. Cupid Boutique"
               autocomplete="off" enterkeyhint="done"></label>
      <button class="btn pink" id="collAdd">Add collection</button>
    </div>
    ${rows.length ? rows.map((c,i) => collRow(c,i,rows.length)).join('') : `
      <div class="empty">
        <div class="big">No collections yet</div>
        <div class="small">Add one, then put photos inside it.</div>
      </div>`}`;

  $('#collAdd').onclick = collCreate;
  $('#collNew').onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); collCreate(); } };
  $('#v-lookbook').querySelectorAll('[data-coll]').forEach(el => {
    const id = el.dataset.coll, act = el.dataset.act;
    if (act === 'open')   el.onclick  = () => { openColl = id; renderLookbook(); window.scrollTo(0,0); };
    if (act === 'name')   el.onchange = () => collSave(id, { name: el.value.trim() || 'Untitled' });
    if (act === 'toggle') el.onclick  = () => collToggle(id);
    if (act === 'del')    el.onclick  = () => collDelete(id);
    if (act === 'pos')    el.onchange = () => collMove(id, parseInt(el.value,10));
    if (act === 'up')     el.onclick  = () => collNudge(id,-1);
    if (act === 'down')   el.onclick  = () => collNudge(id, 1);
  });
}

  <div class="lb-row${c.is_active ? '' : ' off'}">
    ${cover
      ? `<img class="lb-shot" src="${esc(cover.image_url)}" alt="" data-coll="${c.id}" data-act="open">`
      : `<div class="lb-shot" data-coll="${c.id}" data-act="open"></div>`}
    <div class="lb-meta">

        shots.length ? `${shots.length} photo${shots.length===1?'':'s'}` : 'No photos yet'}</div>

/* ---------------- inside one collection ---------------- */
function renderCollection(){
  const c = DB.collections.find(x => x.id === openColl);
  const rows = shotsIn(c.id);

  $('#v-lookbook').innerHTML = `
    <button class="btn ghost sm" id="collBack" style="margin-bottom:12px">&larr; All collections</button>

      <button class="btn pink" id="lbAdd">Add photos</button>
      <input type="file" id="lbFile" accept="image/*" multiple hidden>
    </div>

    if (act === 'up')      el.onclick  = () => lbNudge(id,-1);
    if (act === 'down')    el.onclick  = () => lbNudge(id, 1);
  });
}

function lbRow(r, i, n){
  return `
  <div class="lb-row${r.is_active ? '' : ' off'}">

/* ---------------- collection actions ---------------- */
async function collCreate(){
  const box  = $('#collNew');
  const name = (box?.value || '').trim();
  if (!name){ toast('Give the collection a name first'); box?.focus(); return; }
  const next = DB.collections.reduce((m,c) => Math.max(m, c.display_order), -1) + 1;
  const { data, error } = await sb.from('lookbook_collections')
    .insert({ name, display_order:next, is_active:true }).select().single();
  // Most likely cause: the collections table has not been created yet.
  if (error) return toast(/relation|does not exist|schema cache/i.test(error.message)
    ? 'Collections table not set up yet — run the Supabase migration.'
    : error.message);
  DB.collections.push(data);
  openColl = data.id;
  renderLookbook();
  toast('Collection added');
}

async function collSave(id, patch){
  Object.assign(DB.collections.find(c => c.id === id), patch);
  const { error } = await sb.from('lookbook_collections').update(patch).eq('id', id);
  if (error) return toast(error.message);
  renderLookbook();
  toast('Saved');
}

async function collToggle(id){
  const c = DB.collections.find(x => x.id === id);
  const on = !c.is_active;
  c.is_active = on;
  renderLookbook();
  const { error } = await sb.from('lookbook_collections').update({ is_active:on }).eq('id', id);
  if (error){ c.is_active = !on; renderLookbook(); return toast(error.message); }
  toast(on ? 'Showing on the site' : 'Hidden from the site');
}

// Deleting a collection takes its photos with it — rows and stored files.
async function collDelete(id){
  const c = DB.collections.find(x => x.id === id);
  const shots = shotsIn(id);
  if (!confirm(shots.length
      ? `Delete "${c.name}" and its ${shots.length} photo${shots.length===1?'':'s'}? This cannot be undone.`
      : `Delete "${c.name}"?`)) return;

  const paths = shots.map(s => s.storage_path).filter(Boolean);
  if (paths.length) await sb.storage.from('lookbook-images').remove(paths);
  // the row's foreign key cascades, but clear them here too so the UI is right
  await sb.from('lookbook_images').delete().eq('collection_id', id);
  const { error } = await sb.from('lookbook_collections').delete().eq('id', id);
  if (error) return toast(error.message);

  DB.lookbook = DB.lookbook.filter(r => r.collection_id !== id);
  DB.collections = DB.collections.filter(x => x.id !== id);
  if (openColl === id) openColl = null;
  await collRenumber();
  renderLookbook();
  toast('Collection deleted');
}

function collNudge(id, d){
  const rows = collSorted();
  collMove(id, rows.findIndex(c => c.id === id) + 1 + d);
}

async function collMove(id, pos){
  const rows = collSorted();
  const from = rows.findIndex(c => c.id === id);
  let to = (Number.isFinite(pos) ? pos : from + 1) - 1;
  to = Math.max(0, Math.min(rows.length - 1, to));
  if (to === from) return renderLookbook();
  rows.splice(to, 0, rows.splice(from,1)[0]);
  rows.forEach((c,i) => c.display_order = i);
  renderLookbook();
  await collRenumber();
}

async function collRenumber(){
  const rows = collSorted();
  rows.forEach((c,i) => c.display_order = i);
  const res = await Promise.all(rows.map(c =>
    sb.from('lookbook_collections').update({ display_order:c.display_order }).eq('id', c.id)));
  const bad = res.find(x => x.error);
  if (bad) toast(bad.error.message);
}

/* ---------------- photo actions ---------------- */
async function lbUpload(files, collectionId){
  if (!files.length) return;
  let next = shotsIn(collectionId).reduce((m,r) => Math.max(m, r.display_order), -1) + 1;

  for (const file of files){
    const ext  = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const path = `${crypto.randomUUID()}.${ext}`;
    const { error:upErr } = await sb.storage.from('lookbook-images')
      .upload(path, file, { cacheControl:'3600', upsert:false });
    if (upErr){ toast('Photo upload failed: ' + upErr.message); break; }

    const { data:{ publicUrl } } = sb.storage.from('lookbook-images').getPublicUrl(path);
    const { data, error } = await sb.from('lookbook_images').insert({
      image_url:publicUrl, storage_path:path, display_order:next++,
      is_active:true, collection_id:collectionId
    }).select().single();
    if (error){ toast(error.message); break; }
    DB.lookbook.push(data);
  }
  renderLookbook();
  toast(files.length === 1 ? 'Photo added' : `${files.length} photos added`);
}

async function lbSave(id, patch){
  Object.assign(DB.lookbook.find(r => r.id === id), patch);
  const { error } = await sb.from('lookbook_images').update(patch).eq('id', id);
  if (error) return toast(error.message);
  toast('Saved');
}

async function lbToggle(id){
  const r = DB.lookbook.find(x => x.id === id);
  const on = !r.is_active;
  r.is_active = on;
  renderLookbook();
  const { error } = await sb.from('lookbook_images').update({ is_active:on }).eq('id', id);
  if (error){ r.is_active = !on; renderLookbook(); return toast(error.message); }
  toast(on ? 'Showing on the site' : 'Hidden from the site');
}

async function lbDelete(id){
  const r = DB.lookbook.find(x => x.id === id);
  if (!confirm('Delete this photo?')) return;
  if (r.storage_path) await sb.storage.from('lookbook-images').remove([r.storage_path]);
  const { error } = await sb.from('lookbook_images').delete().eq('id', id);
  if (error) return toast(error.message);
  const cid = r.collection_id;
  DB.lookbook = DB.lookbook.filter(x => x.id !== id);
  await lbRenumber(cid);
  renderLookbook();
  toast('Photo deleted');
}

function lbNudge(id, d){
  const r = DB.lookbook.find(x => x.id === id);
  const rows = shotsIn(r.collection_id);
  lbMove(id, rows.findIndex(x => x.id === id) + 1 + d);
}

async function lbMove(id, pos){
  const r = DB.lookbook.find(x => x.id === id);
  const rows = shotsIn(r.collection_id);
  const from = rows.findIndex(x => x.id === id);
  let to = (Number.isFinite(pos) ? pos : from + 1) - 1;
  to = Math.max(0, Math.min(rows.length - 1, to));
  if (to === from) return renderLookbook();
  rows.splice(to, 0, rows.splice(from,1)[0]);
  rows.forEach((x,i) => x.display_order = i);
  renderLookbook();
  await lbRenumber(r.collection_id);
}

async function lbRenumber(collectionId){
  const rows = shotsIn(collectionId);
  rows.forEach((r,i) => r.display_order = i);
  const res = await Promise.all(rows.map(r =>
    sb.from('lookbook_images').update({ display_order:r.display_order }).eq('id', r.id)));
  const bad = res.find(x => x.error);
  if (bad) toast(bad.error.message);
}

async function act(btn, fn, id, msg){
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  const { error } = await sb.rpc(fn, { p_order_id:id });
  if (error){ toast(error.message); btn.disabled=false; return; }
  await load(); renderOrders(); toast(msg);
}
async function setStatus(btn, id, status, msg){
  btn.disabled = true;
  const { error } = await sb.from('orders').update({ status }).eq('id', id);
  if (error){ toast(error.message); btn.disabled=false; return; }
  await load(); renderOrders(); toast(msg);
}

/* =====================================================================
   RECORD A SALE BY HAND
   ===================================================================== */
let cart = [], cartCur = 'TTD';
function openManual(){ cart = []; cartCur = 'TTD'; drawManual(); }

function drawManual(){
  const total = cart.reduce((s,l)=>s+l.unit_price*l.qty, 0);
  $('#sheetHost').innerHTML = `
  <div class="scrim" id="scrim"></div>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="shead"><h2>Record a sale</h2>
      <button class="linkbtn" id="closeSheet">Close</button></div>
    <div class="sbody">
      <p class="dim small" style="margin-bottom:16px">
        For a sale that happened in a DM or in person. Stock comes down straight away.</p>

      <div class="seg" style="margin-bottom:16px">
        ${['TTD','USD'].map(c=>`<button data-cur="${c}"
          aria-selected="${cartCur===c}">Paid in ${c}</button>`).join('')}
      </div>

      <label class="field"><span>Add a piece</span>
        <select id="mVariant"><option value="">Choose a size…</option>
          ${DB.products.map(p => (p.variants||[]).slice().sort(sortSizes).map(v=>`
            <option value="${v.id}">${esc(p.name)} — ${esc(v.size)} (${v.stock} left)</option>`)
            .join('')).join('')}
        </select></label>

      ${cart.length ? `<div class="card" style="padding:12px">
        ${cart.map((l,i)=>`<div class="between"
          style="padding:7px 0;border-bottom:1px dashed var(--line)">
          <div class="grow"><div class="small truncate">${esc(l.product_name)}</div>
            <div class="tiny dim">${esc(l.size)} · ${money(l.unit_price,cartCur)} each</div></div>
          <div class="stepper" style="width:92px">
            <button type="button" data-cq="${i}:-1">−</button>
            <input type="number" value="${l.qty}" data-cqi="${i}" min="1">
            <button type="button" data-cq="${i}:1">+</button></div>
          <button class="del" data-cdel="${i}">×</button></div>`).join('')}
        <div class="between" style="padding-top:11px">
          <span class="tiny dim" style="letter-spacing:.16em;text-transform:uppercase">Total</span>
          <span class="num" style="font-size:17px">${money(total,cartCur)}</span></div>
      </div>` : `<p class="dim small" style="margin-bottom:16px">No pieces added yet.</p>`}

      <label class="field"><span>Customer name</span>
        <input type="text" id="mName" placeholder="Optional"></label>
      <label class="field"><span>Instagram or WhatsApp</span>
        <input type="text" id="mHandle" placeholder="Optional"></label>
      <label class="field"><span>Note</span>

    </div>
    <div class="sfoot">
      <button class="btn ghost" id="cancelSheet">Cancel</button>
      <button class="btn" id="saveOrder" ${cart.length?'':'disabled'}>
        Record ${money(total,cartCur)}</button>
    </div>
  </div>`;

  const close = () => { $('#sheetHost').innerHTML=''; cart=[]; };
  $('#scrim').onclick = close; $('#closeSheet').onclick = close; $('#cancelSheet').onclick = close;

  document.querySelectorAll('[data-cur]').forEach(b => b.onclick = () => {
    cartCur = b.dataset.cur;
    cart.forEach(l => {
      const p = DB.products.find(p=>p.id===l.product_id);

    cart[i].qty = Math.max(1, cart[i].qty + d); drawManual();
  });
  document.querySelectorAll('[data-cqi]').forEach(inp => inp.onchange = () => {
    cart[Number(inp.dataset.cqi)].qty = Math.max(1, parseInt(inp.value)||1); drawManual();
  });
  document.querySelectorAll('[data-cdel]').forEach(b => b.onclick = () => {
    cart.splice(Number(b.dataset.cdel),1); drawManual();
  });
  $('#saveOrder').onclick = saveManual;
}

async function saveManual(){
  const btn = $('#saveOrder');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  const subtotal = cart.reduce((s,l)=>s+l.unit_price*l.qty, 0);

  const { data:order, error } = await sb.from('orders').insert({
    source:'manual', status:'pending', currency:cartCur, subtotal,
    customer_name:   $('#mName').value.trim()   || null,
    customer_handle: $('#mHandle').value.trim() || null,
    note:            $('#mNote').value.trim()   || null
  }).select().single();
  if (error){ toast(error.message); btn.disabled=false; return; }

  const { error:iErr } = await sb.from('order_items')
    .insert(cart.map(l => ({ ...l, order_id:order.id })));
  if (iErr){ toast(iErr.message); btn.disabled=false; return; }

  const { error:cErr } = await sb.rpc('confirm_order', { p_order_id:order.id });
  if (cErr){ toast(cErr.message); btn.disabled=false; return; }

  await load(); $('#sheetHost').innerHTML=''; cart=[];
  orderFilter='confirmed'; render();
  toast('Sale recorded, stock updated');
}

boot();
</script>
</body>
</html>
